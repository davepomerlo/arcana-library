    year: 2006
    language: Ancient Greek and English
    tradition: [Orphic, Greek]
    kind: edition
    url: https://www-current.chs.harvard.edu/?p=6023
    note: Online text, translation and images of Europe's oldest surviving book, a commentary on an Orphic theogony.
  - title: Vesuvius Challenge — reading the Herculaneum scrolls
    author: Nat Friedman, Daniel Gross, Brent Seales and contestants
    date: 2023 to the present
    year: 2024
    language: Ancient Greek
    tradition: [Epicurean, Greek]
    kind: report
    url: https://scrollprize.org/winners
