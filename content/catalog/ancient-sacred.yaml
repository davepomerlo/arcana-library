  - title: "Back to the Cedar Forest — The Beginning and End of Tablet V of the Standard Babylonian Epic of Gilgameš"
    author: Farouk N. H. Al-Rawi and Andrew R. George
    date: "2014"
    year: 2014
    language: Akkadian and English
    tradition: [Mesopotamian]
    kind: study
    url: https://soas-repository.worktribe.com/OutputFile/451827
