# Builds the site and publishes it to GitHub Pages on every push to main.
# Once a week (and on manual runs) it first checks L/L Research for new channelling
# transcripts (data/llresearch-index.json, links only) and OpenAlex for new scholarship
# (data/new-scholarship.json), and commits those files if they changed. It also downloads any
# books queued in data/sacred-texts-mirror.yaml from sacred-texts.com (tools/mirror_sacred_texts.py).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (12:17 in Japan)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check L/L Research for new transcripts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python tools/track_llresearch.py --wayback || true
          python tools/track_scholarship.py || true
          if ! git diff --quiet -- data/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Weekly update: channelling index and new scholarship"
            git push
          fi
      - name: Mirror queued books from sacred-texts.com
        # Runs on every build but only downloads books not yet in content/mirror/,
        # so it is quick unless something new was added to data/sacred-texts-mirror.yaml.
        continue-on-error: true
        timeout-minutes: 150
        run: |
          python tools/mirror_sacred_texts.py || true
          if [ -n "$(git status --porcelain -- content/mirror/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add content/mirror/
            git commit -m "Mirror books from sacred-texts.com (attribution kept)"
            git pull --rebase && git push
          fi
      - run: python tools/check_texts.py
      - run: python build.py
      - run: python tools/check_internal_links.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
